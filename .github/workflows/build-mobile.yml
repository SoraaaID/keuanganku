name: Build Android APK (KeuanganKu)

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install NPM Dependencies & Build Web Assets
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Test IndexedDB migration and concurrent edits in Chrome
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-test-venv"
          "$RUNNER_TEMP/browser-test-venv/bin/pip" install selenium==4.27.1
          "$RUNNER_TEMP/browser-test-venv/bin/python" test/browser-storage.py

      - name: Setup Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KeuanganKu-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
